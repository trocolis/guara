; Guará — configuração do PlatformIO
; Ambientes:
;   esp32  : firmware do aparelho (ESP-IDF puro)
;   native : testes unitários da lógica pura (lib/), executados no computador

[platformio]
default_envs = esp32

[env]
build_flags =
    -DGUARA_VERSION=\"0.5.0\"

[env:esp32]
platform = espressif32@7.1.3
board = nodemcu-32s
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *
extra_scripts = tools/pio_storage.py

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_ignore = lua
extra_scripts = pre:tools/pio_storage_test.py
build_flags =
    ${env.build_flags}
    -std=c11
    -Wall
    -Wextra
    -Wshadow
